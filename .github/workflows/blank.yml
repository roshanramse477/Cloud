name: Deploy Pages
on: 
  push: 
    branches: [main]
permissions: 
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@4
      - uses: actions/upload-pages-artifact@3
        with:
         path:
      - uses: actions/deploy-pages@4
